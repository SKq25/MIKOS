name: Build MIKOS APK
on:
  push:
    paths:
      - mikos-android-kotlin.zip
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: unzip -q mikos-android-kotlin.zip
      - run: gradle -p MIKOS-Android-Kotlin assembleDebug --no-daemon -PmikosServer="$MIKOS_SERVER"
        env:
          MIKOS_SERVER: ${{ vars.MIKOS_SERVER }}
      - uses: actions/upload-artifact@v4
        with:
          name: MIKOS-apk
          path: MIKOS-Android-Kotlin/app/build/outputs/apk/debug/app-debug.apk
